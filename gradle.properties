# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with
# the Android operating system, and which are packaged with the APK.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Generate per-module R classes so the app only references resources it owns.
android.nonTransitiveRClass=true

# Kotlin comes from AGP 9's built-in support (no org.jetbrains.kotlin.android
# plugin) and the module uses AGP 9's new DSL. Both are the AGP 9 defaults, so
# the compatibility flags the upgrade assistant wrote are no longer needed.
